.xs{--chassis:#E7EBE9;--panel:#fff;--plate:#0E1614;--ink:#14201D;--dim:#6A7875;
 --rule:#CDD6D3;--live:#1B4D5A;
 --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
 --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 background:var(--chassis);color:var(--ink);font-family:var(--sans);font-size:14px;
 line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
.xs *{box-sizing:border-box}
.xs button,.xs input,.xs select{font:inherit;color:inherit}
.xs :focus-visible{outline:2px solid var(--live);outline-offset:2px}
.xs h2{margin:0;font-size:10px;letter-spacing:.17em;text-transform:uppercase;
 color:var(--dim);font-weight:650}

.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
 padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:9px;color:var(--live)}
.brand b{display:block;font-size:15px;font-weight:750;letter-spacing:-.015em;color:var(--ink)}
.brand i{display:block;font-style:normal;font-size:10px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--dim)}
.beamctl{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.beamctl label{display:block}
.beamctl span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--dim);margin-bottom:3px}
.beamctl select,.beamctl input{padding:6px 8px;border:1px solid var(--rule);border-radius:3px;
 background:#FBFCFC;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.beamctl input{width:92px}
.libload{position:relative}
.libbtn{display:inline-block;padding:6px 10px;border:1px dashed var(--rule);border-radius:3px;
 background:#FBFCFC;font-family:var(--mono);font-size:12.5px;cursor:pointer;color:var(--live)}
.libbtn:hover{border-color:var(--live);border-style:solid}
.libbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.loadmsg{margin:0;padding:7px 18px;background:#E9F1EF;color:#204A44;font-size:12px;
 display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule)}
.loadmsg.bad{background:#F7EBE4;color:#8A4B12}
.loadmsg button{border:0;background:none;color:inherit;cursor:pointer;font-size:12px;
 text-decoration:underline;padding:0}
.loadmsg button:last-child{margin-left:auto;text-decoration:none;font-size:16px}

.ptwrap{padding:12px 18px 14px;background:var(--panel);border-bottom:1px solid var(--rule)}
.pthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 6px 2px 8px;border:0;
 border-radius:3px;background:var(--live);color:#fff;font-family:var(--mono);font-size:12px;
 cursor:pointer}
.chip span{opacity:.65;font-size:14px;line-height:1}
.chip:hover span{opacity:1}
.clear{border:0;background:none;color:var(--dim);font-size:11.5px;cursor:pointer;
 text-decoration:underline;padding:2px 4px}
.ghosttxt{font-size:12px;color:var(--dim)}

.aibar{margin:0 0 10px;padding:8px 9px;background:#F1F5F4;border:1px solid var(--rule);
 border-radius:4px}
.airow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.airow.sub{margin-top:7px}
.ailab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.aiq{flex:1;min-width:200px;padding:6px 9px;border:1px solid var(--rule);border-radius:3px;
 background:var(--panel);font-family:var(--mono);font-size:12.5px}
.aikey{width:220px;padding:5px 8px;border:1px solid var(--rule);border-radius:3px;
 background:var(--panel);font-family:var(--mono);font-size:12px}
.aisel{width:auto;min-width:150px}
.aihint{font-size:10.5px;color:var(--dim);line-height:1.45;flex:1;min-width:220px}
.aimsg{margin:8px 0 0;padding:8px 10px;border-radius:3px;font-size:11.5px;line-height:1.5}
.aimsg.bad{background:#F7EBE4;color:#8A4B12}
.aimsg.ok{background:#E9F1EF;color:#204A44}
.aimsg.warn{background:#F6F0E2;color:#6E5518}
.aihead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.aihead b{font-size:12.5px}
.aihead span{font-family:var(--mono);font-size:10.5px;opacity:.8}
.aihead button{margin-left:auto;border:0;background:none;color:inherit;cursor:pointer;
 font-size:11px;text-decoration:underline}
.aiwarn,.aiok,.aifoot{margin:3px 0 0}
.aiwarn::before{content:"\u26A0  "}
.aiok::before{content:"\u2713  "}
.aifoot{opacity:.75;font-size:10.5px;margin-top:6px}
.badge{display:inline-block;padding:0 4px;margin-right:5px;border-radius:2px;font-size:8.5px;
 letter-spacing:.08em;vertical-align:1px}
.badge.ai{background:#6E5518;color:#F6F0E2}
.badge.mp{background:#5B3F94;color:#F1EBFA}
.badge.live{background:#1F5B4E;color:#EDF6F3}
.lvcaveat{margin:0 0 10px;font-size:11px;color:var(--dim);line-height:1.5}
.lvcaveat code{font-family:var(--mono);background:#EFF3F2;padding:1px 4px;border-radius:2px}
.livebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;
 padding:7px 9px;background:#F3F6F5;border:1px solid var(--rule);border-radius:4px}
.lvtog{display:flex;align-items:center;gap:6px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.lvtog input{accent-color:var(--live)}
.lvprov{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.lv{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid var(--rule);
 border-radius:3px;background:var(--panel);font-family:var(--mono);font-size:10.5px;cursor:pointer;
 color:var(--dim)}
.lv u{text-decoration:none;font-variant-numeric:tabular-nums}
.lv.ok{color:#1F5B4E;border-color:#9CC7BC;background:#EDF6F3}
.lv.loading{color:var(--live);border-style:dashed}
.lv.fail{color:#9A6224;border-color:#DFC49B;background:#FAF4EA}
.lv.off{opacity:.45;text-decoration:line-through}
.lv:hover{border-color:var(--live)}
.lvmax{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--dim)}
.lvmax select{padding:2px 4px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);
 font-family:var(--mono);font-size:11px}
.lvnote{font-size:11.5px;color:var(--dim)}
.pt{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:2px;max-width:1080px}
.el{position:relative;aspect-ratio:1/1;min-width:0;border:1px solid var(--rule);border-radius:2px;
 background:#F6F8F7;cursor:pointer;padding:0;display:flex;flex-direction:column;
 align-items:center;justify-content:center;line-height:1;overflow:hidden}
.el b{font-size:clamp(8px,1.05vw,13px);font-weight:650}
.el em{position:absolute;top:1px;left:2px;font-style:normal;font-size:clamp(5px,.52vw,7px);
 color:var(--dim);font-family:var(--mono)}
.el u{position:absolute;bottom:0;right:2px;text-decoration:none;font-size:clamp(5px,.52vw,7px);
 color:var(--live);font-family:var(--mono);opacity:.75}
.el:hover:not(:disabled){border-color:var(--live);background:#EAF0EF}
.el.on{background:var(--live);border-color:var(--live);color:#fff}
.el.on em,.el.on u{color:#B7D2D6;opacity:.9}
.el.off{opacity:.28;cursor:default;background:transparent;border-color:#E1E7E5}
.el.transition{background:#EFF3F2}.el.on.transition{background:var(--live)}
.el.lanth,.el.act{background:#F2F0F5}.el.on.lanth,.el.on.act{background:var(--live)}
.el.nonmetal,.el.metalloid{background:#F5F2EC}.el.on.nonmetal,.el.on.metalloid{background:var(--live)}
.fgap{grid-column:3;grid-row:8;height:0}

.body{display:flex;align-items:flex-start}
.rail{width:296px;flex:0 0 296px;background:var(--panel);border-right:1px solid var(--rule);
 max-height:calc(100vh - 60px);overflow-y:auto}
.railhead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 7px;
 position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--rule);z-index:1}
.count{font-family:var(--mono);font-size:11px;color:var(--dim)}
.filterbox{position:relative;padding:7px 12px;border-bottom:1px solid var(--rule);
 background:var(--panel);position:sticky;top:36px;z-index:1}
.txtf{width:100%;padding:5px 24px 5px 8px;border:1px solid var(--rule);border-radius:3px;
 background:#FBFCFC;font-family:var(--mono);font-size:11.5px}
.xf{position:absolute;right:16px;top:9px;border:0;background:none;color:var(--dim);
 cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.more{margin:0;padding:9px 12px;font-size:11px;color:var(--dim);line-height:1.5;
 border-top:1px solid var(--rule)}
.entries{list-style:none;margin:0;padding:0}
.entry{display:flex;gap:8px;width:100%;padding:8px 12px;background:none;border:0;
 border-bottom:1px solid #EDF1F0;cursor:pointer;text-align:left;align-items:center}
.entry:hover{background:#F3F7F6}
.entry.on{background:#E9F1EF}
.dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ecol{flex:1;min-width:0}
.eform{display:block;font-size:13px;font-weight:650}
.eform sub{font-size:.72em}
.ename{display:block;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis}
.emeta{text-align:right;flex:0 0 auto}
.esg{display:block;font-family:var(--mono);font-size:10.5px}
.ecell{display:block;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.empty{margin:14px;font-size:12px;color:var(--dim);line-height:1.5}

.main{flex:1;min-width:0;padding:14px}
.plate-wrap{background:var(--plate);border-radius:5px;overflow:hidden}
.plate-bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
 padding:8px 12px;border-bottom:1px solid #1D2C28}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#D6E2DF}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.lg u{text-decoration:none;color:#6E8783;font-family:var(--mono);font-size:10px}
.tools{display:flex;gap:5px}
.t{padding:3px 9px;border:1px solid #2A3B37;border-radius:3px;background:transparent;
 color:#8FA4A0;font-size:11px;cursor:pointer}
.t:hover{color:#D6E2DF}
.t.on{background:#E8EDEB;color:#0E1614;border-color:#E8EDEB;font-weight:650}
.readout{display:flex;gap:16px;padding:6px 12px;font-family:var(--mono);font-size:11.5px;
 color:#D6E2DF;font-variant-numeric:tabular-nums;border-bottom:1px solid #1D2C28}
.readout b{color:#6E8783;font-weight:500;margin-right:4px}
.readout .dim,.legend .dim{color:#5E7370}
.plate{display:block;cursor:crosshair;user-select:none;touch-action:pan-y}
.bg{fill:var(--plate)}
.grid{stroke:#1E2E2A}.axis{stroke:#3C524D}
.trace{fill:none;stroke-width:1.25;stroke-linejoin:round}
.hkltick{stroke-width:1.4;opacity:.9}
.cross{stroke:#7FD4C4;stroke-width:1;stroke-dasharray:3 3;opacity:.8;pointer-events:none}
.band{fill:#7FD4C4;opacity:.13;pointer-events:none}
.dtick{stroke:#4E6763}
.dlab,.xlab,.ylab,.axname{fill:#8FA4A0;font-family:var(--mono);font-size:9.5px;
 font-variant-numeric:tabular-nums}
.dlab,.xlab{text-anchor:middle}
.axname{fill:#5E7370;font-size:9px}

.cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:13px;margin-top:13px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:11px 13px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ghost{padding:4px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);
 font-size:11px;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--live);color:var(--live)}
.ghost:disabled{opacity:.4;cursor:default}
.scroll{max-height:270px;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;
 font-variant-numeric:tabular-nums}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:500;
 color:var(--dim);font-size:9.5px;letter-spacing:.05em;padding:3px 6px;
 border-bottom:1px solid var(--rule)}
.tbl td{padding:3px 6px;border-bottom:1px solid #EDF1F0}
.tbl .r{text-align:right}
.tbl .nm{font-family:var(--sans);font-size:12.5px;font-weight:600}
.tbl .nm sub{font-size:.72em}
.tbl tr.lit{background:#E9F1EF}
.note{margin:13px 0 0;font-size:11.5px;color:var(--dim);line-height:1.55;max-width:78ch}

@media (max-width:900px){
 .body{flex-direction:column}
 .rail{width:100%;flex:none;max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
 .cards{grid-template-columns:1fr}
 .ptwrap,.top{padding-left:12px;padding-right:12px}
 .main{padding:12px}
 .el em{display:none}
}
